name: Build Storms Technologies Backup System

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/StormsBackupSystem.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/StormsBackupSystem/StormsBackupSystem.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: StormsBackupSystem-win-x64
          path: publish/StormsBackupSystem.exe

      - name: Attach exe to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/StormsBackupSystem.exe
